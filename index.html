<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to My Digital Library</h1>
        <p>Your collection of books, free to read and download!</p>
    </header>
    
    <section class="books">
        <div class="book-card">
            <img src="covers/book1-cover.jpg" alt="Book 1">
            <h2>Book Title 1</h2>
            <p>Category: Fiction</p>
            <div class="buttons">
                <a href="books/book1.pdf" target="_blank" class="read">📖 Read</a>
                <a href="books/book1.pdf" download class="download">⬇️ Download</a>
            </div>
        </div>

        <div class="book-card">
            <img src="covers/book2-cover.jpg" alt="Book 2">
            <h2>Book Title 2</h2>
            <p>Category: Science</p>
            <div class="buttons">
                <a href="books/book2.pdf" target="_blank" class="read">📖 Read</a>
                <a href="books/book2.pdf" download class="download">⬇️ Download</a>
            </div>
        </div>

        <!-- Add more books here following the same pattern -->
    </section>

    <footer>
        <p>&copy; 2025 My Digital Library</p>
    </footer>
</body>
</html>
